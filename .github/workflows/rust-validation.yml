name: Rust Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test And Tool Contract (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Format check
        run: cargo fmt --check

      - name: Unit and integration tests
        run: cargo test

      - name: Tool schema snapshot
        run: cargo test tools::tests::tool_schema_snapshot_contract_is_stable

      - name: Print tool inventory
        run: |
          set -euo pipefail
          count=$(CLOUDFLARE_MCP_AUTH_MODE=off cargo run -- --print-tools | jq length)
          test "$count" -ge 80
          echo "tool_count=$count"

      - name: Release provenance manifest
        run: |
          set -euo pipefail
          cargo build --release
          scripts/generate-release-provenance.sh \
            --binary target/release/cloudflare-mcp \
            --output .tmp/release-provenance.json
          jq -e '
            .source.repository == "sednalabs/cloudflare-mcp" and
            .source.commit == env.GITHUB_SHA and
            .source.dirty == false and
            .binary.sha256 != "" and
            .binary.size_bytes > 0 and
            .tools.count >= 80 and
            .tools.inventory_sha256 != "" and
            .contracts.tool_schema_snapshot_sha256 != "" and
            .contracts.cloudflare_api_catalog_sha256 != "" and
            .dependencies.mcp_toolkit_rs_revision != ""
          ' .tmp/release-provenance.json >/dev/null
          jq '{source, binary: {sha256: .binary.sha256, size_bytes: .binary.size_bytes}, tools, contracts, dependencies}' \
            .tmp/release-provenance.json

      - name: Package release binary bundle
        run: |
          set -euo pipefail
          artifact="cloudflare-mcp-linux-${{ matrix.arch }}-stdio-${GITHUB_SHA}"
          mkdir -p dist/package dist/verify
          install -m 0755 target/release/cloudflare-mcp dist/package/cloudflare-mcp
          install -m 0644 .tmp/release-provenance.json dist/package/release-provenance.json

          test "$(stat -c '%a' dist/package/cloudflare-mcp)" = 755
          case "${{ matrix.arch }}" in
            x86_64) expected_machine='Advanced Micro Devices X86-64' ;;
            aarch64) expected_machine='AArch64' ;;
            *) echo "unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          readelf -h dist/package/cloudflare-mcp | grep -F 'Machine:' | grep -F "$expected_machine"
          test "$(sha256sum dist/package/cloudflare-mcp | cut -d ' ' -f 1)" = \
            "$(jq -r '.binary.sha256' dist/package/release-provenance.json)"

          (
            cd dist/package
            sha256sum cloudflare-mcp release-provenance.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            tar -czf "../${artifact}.tar.gz" cloudflare-mcp release-provenance.json SHA256SUMS
          )
          (
            cd dist
            sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"
            sha256sum -c "${artifact}.tar.gz.sha256"
          )

          tar -xzf "dist/${artifact}.tar.gz" -C dist/verify
          test "$(stat -c '%a' dist/verify/cloudflare-mcp)" = 755
          (cd dist/verify && sha256sum -c SHA256SUMS)
          readelf -h dist/verify/cloudflare-mcp | grep -F 'Machine:' | grep -F "$expected_machine"

      - name: Upload release binary bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-mcp-linux-${{ matrix.arch }}-stdio-${{ github.sha }}
          path: |
            dist/cloudflare-mcp-linux-${{ matrix.arch }}-stdio-${{ github.sha }}.tar.gz
            dist/cloudflare-mcp-linux-${{ matrix.arch }}-stdio-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
